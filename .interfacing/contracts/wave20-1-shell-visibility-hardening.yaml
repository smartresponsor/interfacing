version: 1
wave: 20.1
name: shell-visibility-hardening
status: active
purpose: Ensure Interfacing-owned routes render footer and quick-menu chrome through a deterministic component-owned shell base instead of ambiguous host base.html.twig resolution.
canonical_templates:
  component_shell_base: template/interfacing/shell/base.html.twig
  component_local_base: template/interfacing/base.html.twig
  standalone_host_base: template/base.html.twig
render_markers:
  - data-sr-shell-base="interfacing-owned"
  - data-sr-shell-contract="wave20.1"
  - data-sr-shell-slot="quick-menu"
compatibility:
  public_routes_changed: false
  twig_payload_shape_changed: false
  host_base_template_required_for_interfacing_routes: false
host_wide_note: Other component pages still need host shell inclusion/adoption for true system-wide footer coverage.
