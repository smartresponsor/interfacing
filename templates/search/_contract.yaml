surface: search
owner: Interfacing
purpose: Search results, commerce search, facets, suggestions, and autocomplete surfaces.
operations:
  result:
    expects: [query, results, filters, facets, pagination, actions]
  commerce:
    expects: [query, results, products, categories, filters, pagination, actions]
  suggestion:
    expects: [query, suggestions, results, actions]
  facet:
    expects: [facets, filters, resultCount, actions]
  autocomplete:
    expects: [query, suggestions, recentQueries, actions]
notes:
  - Searching owns query execution and permission-aware results.
  - Interfacing owns visual result/facet/autocomplete layouts.
