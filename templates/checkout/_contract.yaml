surface: checkout
owner: Interfacing
rendered_by: Viewing
purpose: Checkout visual surface for staged cart, shipping, payment, review, and success flows.
operations:
  index:
    expects: [steps, items, lines, summary, totals, actions]
  cart:
    expects: [items, lines, cartItems, summary, totals]
  shipping:
    expects: [shippingMethods, rates, address, summary, totals]
  payment:
    expects: [paymentMethods, methods, paymentIntent, summary, totals]
  review:
    expects: [items, lines, checkout, context, summary, totals]
  success:
    expects: [confirmation, order, payment, actions]
notes:
  - Payment submission, fraud checks, and command handling remain producer responsibilities.
  - Checkout templates expose stable data-ui-zone hooks for future UI enrichment.
