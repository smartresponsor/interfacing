surface: product
owner: Interfacing template layer
purpose: Product list, detail, pricing, inventory, media, review, and recommendation surfaces.
operations:
  index:
    expects: [products, metrics, actions]
  list:
    expects: [products, filters, sortOptions, pagination, actions]
  detail:
    expects: [product, images, price, inventory, recommendations, actions]
  gallery:
    expects: [images, gallery, media]
  inventory:
    expects: [inventory, availability, warehouses, variants]
  pricing:
    expects: [price, pricing, prices, priceRules]
  variant:
    expects: [variants, product, inventory]
  review:
    expects: [reviews, rating, moderation]
  recommendation:
    expects: [recommendations, related, products]
notes:
  - Product templates are Twig-only and expose data-ui-zone hooks for future UI-provider enrichment.
  - Producer components own product facts, prices, inventory, and recommendations.
