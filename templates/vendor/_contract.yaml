surface: vendor
owner: Interfacing template layer
purpose: Merchant/vendor commerce surfaces rendered through Viewing.
operations:
  index:
    expects: [vendors, items, records, metrics, summary, actions]
  dashboard:
    expects: [vendor, merchant, profile, metrics, summary, transactions, payoutAccount, risk, compliance, actions]
  profile:
    expects: [profile, vendor, merchant, adapters, integrations, actions]
  merchant-profile:
    expects: [merchant, vendor, profile, adapters, integrations, actions]
  transaction:
    expects: [transactions, records, filters, sort, query, pagination, actions]
  transaction-detail:
    expects: [transaction, transactions, timeline, events, detail, context, actions]
  payout:
    expects: [payoutAccount, account, statement, payoutStatement, lines, transactions, schedule, settlements, actions]
  payout-account:
    expects: [payoutAccount, account, method, schedule, actions]
  payout-history:
    expects: [payouts, records, filters, sort, query, pagination, actions]
  payout-method:
    expects: [method, payoutMethod, payoutAccount, verification, context, actions]
  payout-schedule:
    expects: [schedule, settlementSchedule, policy, context, actions]
  payout-statement:
    expects: [statement, payoutStatement, lines, transactions, actions]
  statement-export:
    expects: [statement, lines, transactions, export, delivery, actions]
  settlement:
    expects: [settlement, status, entries, transactions, reconciliation, context, actions]
  adapter:
    expects: [adapters, records, context, detail, actions]
  metric:
    expects: [metrics, summary, series, records, context, actions]
  onboarding:
    expects: [profile, vendor, checklist, steps, actions]
  risk:
    expects: [risk, compliance, events, disputes, records, actions]
  commission:
    expects: [commissionSummary, metrics, commissions, lines, policy, context, actions]
  catalog-syndication:
    expects: [destinations, adapters, packages, records, policy, fallback, actions]
  media-readiness:
    expects: [media, assets, records, policy, preference, context, actions]
notes:
  - Producer components own vendor, payout, transaction, integration, and risk data preparation.
  - Viewing owns response selection and template resolution.
  - Interfacing owns the merchant-facing visual grammar and reusable partials.
